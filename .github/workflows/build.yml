
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP file not found!"
            exit 1
          fi

          mkdir android-src
          unzip "$ZIP_FILE" -d android-src

          SETTINGS_FILE=$(find android-src \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Daftar-Hesabdari-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
